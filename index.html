<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>SIGNAL - 3D TRAFFIC LIGHT SIMULATOR</title>
        <style>
            :root{--asphalt:#2b3241; --panel:#080b10; --amber:#ffb020; --red:#ff3b30;--green:#2ee66b; --idle:#344155;--text:#cdd0d8be;}
            *{box-sizing:border-box;}
            html,body{margin:0;height:100%;background:var(--asphalt);font-family:'Courier New',ui-monospace,monospace;color:var(--text);overflow:hidden;} 
            canvas{display:block;cursor:grab;}
            canvas:active{cursor:grabbing;}
            #hud{position:fixed;top:20px;left:20px;background:var(--panel);border:1px solid #2c3038;border-radius:10px;padding:16px 20px;min-width:220px;box-shadow: 0 8px 24px rgba(0,0,0,.4);}
            #hud h1{font-size:13px;letter-spacing: 3px;text-transform:uppercase;margin:0 0 10px;color:#8a8f99;font-weight:600;}
            #state{font-size:28px;font-weight:bold;letter-spacing:1px;margin-bottom:4px;}
            #timer{font-size:13px;color:#8a8f99;margin-bottom:14px;}
            button{background:var(--idle);color:var(--text);border:none;border-radius:6px;padding:9px 14px;font-family:inherit;font-size:12px;letter-spacing:1px;cursor:pointer;width:100%;text-transform:uppercase;}
            button:hover{background:#484f5a;}
            #hint{position:fixed;bottom:16px;left:20px;font-size:11px;color:#565b64;letter-spacing:.5px;}
        </style>
    </head>
    <body>
